<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Sort Visualizer - VisualGO Style Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 500px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .visualization-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .pseudocode-section {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            overflow: hidden;
            max-height: 700px;
            overflow-y: auto;
        }

        .pseudocode-header {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }

        #pseudocode {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 15px;
            line-height: 2;
            color: #d4d4d4;
            background: #1e1e1e;
            padding: 0;
            margin: 0;
        }

        .code-line {
            padding: 6px 10px;
            transition: all 0.3s ease;
            border-radius: 4px;
            position: relative;
        }

        .code-line.highlight {
            background: #264f78;
            border-left: 4px solid #4ec9b0;
            padding-left: 16px;
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(78, 201, 176, 0.3);
        }

        .keyword {
            color: #c586c0;
            font-weight: bold;
        }

        .variable {
            color: #9cdcfe;
        }

        .operator {
            color: #d4d4d4;
        }

        .number {
            color: #b5cea8;
        }

        .comment {
            color: #6a9955;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group label {
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            width: 250px;
        }

        input[type="number"] {
            width: 100px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        #sortBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #randomBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #resetBtn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            min-width: 120px;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        #canvas-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 30px 20px 20px 20px;
            min-height: 450px;
            position: relative;
            overflow: visible;
        }

        .bars-wrapper {
            position: relative;
            height: 350px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
        }

        .bar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .bar {
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 5px 5px 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            transition: all 0.4s ease;
            font-size: 16px;
        }

        .bar.comparing {
            background: linear-gradient(180deg, #ff6b6b 0%, #ff5252 100%);
            box-shadow: 0 0 25px rgba(255, 107, 107, 0.8);
            transform: scale(1.1);
            z-index: 10;
        }

        .bar.swapping {
            background: linear-gradient(180deg, #ffd93d 0%, #ffb800 100%);
            box-shadow: 0 0 25px rgba(255, 217, 61, 0.8);
            transform: scale(1.15);
            z-index: 20;
        }

        .bar.sorted {
            background: linear-gradient(180deg, #6bcf7f 0%, #4caf50 100%);
            box-shadow: 0 0 25px rgba(107, 207, 127, 0.8);
        }

        .bar.pivot {
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 100%);
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.8);
            transform: scale(1.08);
            z-index: 15;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .bar.comparing {
            animation: pulse 0.6s ease-in-out infinite;
        }

        @keyframes swing {
            0%, 100% { transform: scale(1.15) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-3deg); }
            75% { transform: scale(1.15) rotate(3deg); }
        }

        .bar.swapping {
            animation: swing 0.4s ease-in-out;
        }

        .gap-indicator {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.25);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1.3em;
            font-weight: bold;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .status-message {
            text-align: center;
            font-size: 1.1em;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scrollbar styling for pseudocode */
        .pseudocode-section::-webkit-scrollbar {
            width: 8px;
        }

        .pseudocode-section::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        .pseudocode-section::-webkit-scrollbar-thumb {
            background: #4ec9b0;
            border-radius: 4px;
        }

        .pseudocode-section::-webkit-scrollbar-thumb:hover {
            background: #5fd9c0;
        }

        @media (max-width: 1400px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .pseudocode-section {
                max-height: 500px;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
            }

            input[type="text"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Shell Sort Visualizer - VisualGO Style Animation</h1>

        <div class="visualization-section" style="margin-bottom: 20px;">
            <div class="controls">
                <div class="input-group">
                    <label>Mảng:</label>
                    <input type="text" id="arrayInput" placeholder="VD: 64,34,25,12,22,11,90" value="64,34,25,12,22,11,90">
                </div>
                <div class="input-group">
                    <label>Tốc độ (ms):</label>
                    <input type="number" id="speedInput" min="100" max="3000" step="100" value="800">
                </div>
                <button id="sortBtn">▶ Sắp xếp</button>
                <button id="randomBtn">🎲 Ngẫu nhiên</button>
                <button id="resetBtn">🔄 Reset</button>
            </div>

            <div class="info-panel">
                <div class="info-box">
                    <div class="info-label">Gap hiện tại</div>
                    <div class="info-value" id="currentGap">-</div>
                </div>
                <div class="info-box">
                    <div class="info-label">So sánh</div>
                    <div class="info-value" id="compareCount">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Hoán đổi</div>
                    <div class="info-value" id="swapCount">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">Bước</div>
                    <div class="info-value" id="stepCount">0</div>
                </div>
            </div>
        </div>

        <div class="main-layout">
            <div class="visualization-section">
                <div id="canvas-container">
                    <div class="gap-indicator" id="gapIndicator" style="display: none;">Gap: <span id="gapValue">-</span></div>
                    <div class="bars-wrapper" id="barsWrapper"></div>
                </div>
                <div class="status-message" id="statusMsg">Nhập mảng và nhấn "Sắp xếp" để bắt đầu</div>
            </div>

            <div class="pseudocode-section">
                <div class="pseudocode-header">📝 Pseudocode: Shell Sort (Knuth Sequence)</div>
                <pre id="pseudocode"></pre>
            </div>
        </div>
    </div>

    <script>
        // ========== GLOBAL VARIABLES ==========
        let array = [];
        let originalArray = [];
        let steps = [];
        let isRunning = false;
        let animationSpeed = 800;
        let compareCount = 0;
        let swapCount = 0;
        let stepCount = 0;
        let barElements = [];

        // ========== DOM ELEMENTS ==========
        const arrayInput = document.getElementById('arrayInput');
        const speedInput = document.getElementById('speedInput');
        const sortBtn = document.getElementById('sortBtn');
        const randomBtn = document.getElementById('randomBtn');
        const resetBtn = document.getElementById('resetBtn');
        const barsWrapper = document.getElementById('barsWrapper');
        const statusMsg = document.getElementById('statusMsg');
        const currentGapDisplay = document.getElementById('currentGap');
        const compareCountDisplay = document.getElementById('compareCount');
        const swapCountDisplay = document.getElementById('swapCount');
        const stepCountDisplay = document.getElementById('stepCount');
        const pseudocodeElement = document.getElementById('pseudocode');
        const gapIndicator = document.getElementById('gapIndicator');
        const gapValue = document.getElementById('gapValue');

        // ========== PSEUDOCODE ==========
        const pseudocodeLines = [
            '<span class="comment">// Shell Sort using Knuth Sequence (3^k - 1) / 2</span>',
            '<span class="keyword">function</span> <span class="variable">shellSort</span>(<span class="variable">array</span>):',
            '    <span class="variable">n</span> <span class="operator">=</span> <span class="variable">array</span>.<span class="variable">length</span>',
            '    ',
            '    <span class="comment">// Calculate largest Knuth gap <= n</span>',
            '    <span class="variable">gap</span> <span class="operator">=</span> <span class="number">1</span>',
            '    <span class="keyword">while</span> <span class="variable">gap</span> <span class="operator">&lt;</span> <span class="variable">n</span> <span class="operator">/</span> <span class="number">3</span>:',
            '        <span class="variable">gap</span> <span class="operator">=</span> <span class="variable">gap</span> <span class="operator">*</span> <span class="number">3</span> <span class="operator">+</span> <span class="number">1</span>',
            '    ',
            '    <span class="comment">// Start sorting with decreasing gaps</span>',
            '    <span class="keyword">while</span> <span class="variable">gap</span> <span class="operator">&gt;</span> <span class="number">0</span>:',
            '        <span class="keyword">for</span> <span class="variable">i</span> <span class="operator">=</span> <span class="variable">gap</span> <span class="keyword">to</span> <span class="variable">n</span><span class="operator">-</span><span class="number">1</span>:',
            '            <span class="variable">temp</span> <span class="operator">=</span> <span class="variable">array</span>[<span class="variable">i</span>]',
            '            <span class="variable">j</span> <span class="operator">=</span> <span class="variable">i</span>',
            '            ',
            '            <span class="keyword">while</span> <span class="variable">j</span> <span class="operator">&gt;=</span> <span class="variable">gap</span> <span class="keyword">and</span> <span class="variable">array</span>[<span class="variable">j</span><span class="operator">-</span><span class="variable">gap</span>] <span class="operator">&gt;</span> <span class="variable">temp</span>:',
            '                <span class="variable">array</span>[<span class="variable">j</span>] <span class="operator">=</span> <span class="variable">array</span>[<span class="variable">j</span><span class="operator">-</span><span class="variable">gap</span>]',
            '                <span class="variable">j</span> <span class="operator">=</span> <span class="variable">j</span> <span class="operator">-</span> <span class="variable">gap</span>',
            '            ',
            '            <span class="variable">array</span>[<span class="variable">j</span>] <span class="operator">=</span> <span class="variable">temp</span>',
            '        ',
            '        <span class="variable">gap</span> <span class="operator">=</span> (<span class="variable">gap</span> <span class="operator">-</span> <span class="number">1</span>) <span class="operator">/</span> <span class="number">3</span>',
            '    ',
            '    <span class="keyword">return</span> <span class="variable">array</span>'
        ];

        // ========== INITIALIZE ==========
        function init() {
            renderPseudocode();
            parseArray();
            renderBars();
        }

        function renderPseudocode() {
            pseudocodeElement.innerHTML = pseudocodeLines
                .map((line, index) => `<div class="code-line" data-line="${index}">${line}</div>`)
                .join('');
        }

        function highlightLine(lineNumber) {
            const lines = document.querySelectorAll('.code-line');
            lines.forEach((line, index) => {
                if (index === lineNumber) {
                    line.classList.add('highlight');
                    line.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    line.classList.remove('highlight');
                }
            });
        }

        function clearHighlight() {
            document.querySelectorAll('.code-line').forEach(line => {
                line.classList.remove('highlight');
            });
        }

        // ========== ARRAY PARSING ==========
        function parseArray() {
            const input = arrayInput.value.trim();
            array = input.split(',').map(x => parseInt(x.trim())).filter(x => !isNaN(x));

            if (array.length === 0) {
                array = [64, 34, 25, 12, 22, 11, 90];
            }

            originalArray = [...array];
            resetCounters();
        }

        function resetCounters() {
            compareCount = 0;
            swapCount = 0;
            stepCount = 0;
            updateDisplay();
            currentGapDisplay.textContent = '-';
        }

        function updateDisplay() {
            compareCountDisplay.textContent = compareCount;
            swapCountDisplay.textContent = swapCount;
            stepCountDisplay.textContent = stepCount;
        }

        // ========== BAR RENDERING ==========
        function renderBars() {
            barsWrapper.innerHTML = '';
            barElements = [];

            const containerWidth = barsWrapper.offsetWidth;
            const numBars = array.length;
            const totalGap = (numBars - 1) * 5;
            const barWidth = Math.min((containerWidth - totalGap) / numBars, 70);

            const maxValue = Math.max(...array);
            const maxHeight = 300;

            array.forEach((value, index) => {
                const barContainer = document.createElement('div');
                barContainer.className = 'bar-container';
                barContainer.style.width = barWidth + 'px';

                const bar = document.createElement('div');
                bar.className = 'bar';
                bar.style.width = barWidth + 'px';
                bar.style.height = ((value / maxValue) * maxHeight) + 'px';
                bar.textContent = value;

                barContainer.appendChild(bar);
                barsWrapper.appendChild(barContainer);

                barElements.push({
                    container: barContainer,
                    bar: bar,
                    value: value,
                    index: index
                });
            });
        }

        // ========== ANIMATION FUNCTIONS ==========
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function setBarState(index, state) {
            if (barElements[index]) {
                barElements[index].bar.className = `bar ${state}`;
            }
        }

        function clearBarStates() {
            barElements.forEach(bar => {
                bar.bar.className = 'bar';
            });
        }

        async function animateCompare(i, j) {
            setBarState(i, 'comparing');
            setBarState(j, 'comparing');
            compareCount++;
            updateDisplay();
            await sleep(animationSpeed * 0.5);
        }

        async function animateSwap(fromIndex, toIndex) {
            // Mark bars as swapping
            setBarState(fromIndex, 'swapping');
            setBarState(toIndex, 'swapping');

            // Calculate positions for swap animation
            const fromContainer = barElements[fromIndex].container;
            const toContainer = barElements[toIndex].container;

            const fromRect = fromContainer.getBoundingClientRect();
            const toRect = toContainer.getBoundingClientRect();
            const distance = toRect.left - fromRect.left;

            // Apply transform for visual swap
            fromContainer.style.transform = `translateX(${distance}px)`;
            toContainer.style.transform = `translateX(${-distance}px)`;

            swapCount++;
            updateDisplay();
            await sleep(animationSpeed * 0.7);

            // Reset transforms
            fromContainer.style.transform = '';
            toContainer.style.transform = '';

            // Swap in DOM
            const parent = barsWrapper;
            const fromNextSibling = fromContainer.nextSibling;
            const toNextSibling = toContainer.nextSibling;

            if (fromIndex < toIndex) {
                parent.insertBefore(toContainer, fromContainer);
                if (toNextSibling) {
                    parent.insertBefore(fromContainer, toNextSibling);
                } else {
                    parent.appendChild(fromContainer);
                }
            } else {
                parent.insertBefore(fromContainer, toContainer);
                if (fromNextSibling) {
                    parent.insertBefore(toContainer, fromNextSibling);
                } else {
                    parent.appendChild(toContainer);
                }
            }

            // Swap in array
            [barElements[fromIndex], barElements[toIndex]] = [barElements[toIndex], barElements[fromIndex]];
            barElements[fromIndex].index = fromIndex;
            barElements[toIndex].index = toIndex;

            await sleep(animationSpeed * 0.3);

            // Clear states
            setBarState(fromIndex, '');
            setBarState(toIndex, '');
        }

        async function animateSet(index, value) {
            if (barElements[index]) {
                const bar = barElements[index].bar;
                bar.textContent = value;
                barElements[index].value = value;

                // Update height
                const maxValue = Math.max(...array);
                const maxHeight = 300;
                bar.style.height = ((value / maxValue) * maxHeight) + 'px';
            }
        }

        async function animateSorted(index) {
            setBarState(index, 'sorted');
            await sleep(animationSpeed * 0.4);
            setBarState(index, '');
        }

        async function showAllSorted() {
            for (let i = 0; i < barElements.length; i++) {
                setBarState(i, 'sorted');
                await sleep(60);
            }
            await sleep(800);
            clearBarStates();
        }

        // ========== KNUTH GAP SEQUENCE ==========
        function generateKnuthGaps(n) {
            const gaps = [];
            let gap = 1;

            // Generate gaps: 1, 4, 13, 40, 121, ...
            while (gap < n / 3) {
                gap = gap * 3 + 1;
            }

            // Collect gaps in descending order
            while (gap > 0) {
                gaps.push(gap);
                gap = Math.floor((gap - 1) / 3);
            }

            return gaps;
        }

        // ========== SHELL SORT ALGORITHM ==========
        function generateShellSortSteps(arr) {
            steps = [];
            const n = arr.length;
            let tempArray = [...arr];

            steps.push({ type: 'highlight_code', line: 1 });
            steps.push({ type: 'highlight_code', line: 2 });

            // Calculate Knuth gaps
            steps.push({ type: 'highlight_code', line: 5 });
            const gaps = generateKnuthGaps(n);

            steps.push({ type: 'highlight_code', line: 6 });
            steps.push({ type: 'highlight_code', line: 7 });

            // Start sorting with gaps
            steps.push({ type: 'highlight_code', line: 10 });

            for (let gap of gaps) {
                steps.push({ type: 'set_gap', gap: gap });
                steps.push({ type: 'highlight_code', line: 11 });

                for (let i = gap; i < n; i++) {
                    steps.push({ type: 'highlight_code', line: 12 });
                    const temp = tempArray[i];
                    steps.push({ type: 'mark_pivot', index: i });

                    steps.push({ type: 'highlight_code', line: 13 });
                    let j = i;

                    steps.push({ type: 'highlight_code', line: 15 });

                    while (j >= gap && tempArray[j - gap] > temp) {
                        steps.push({ type: 'compare', i: j, j: j - gap });

                        steps.push({ type: 'highlight_code', line: 16 });

                        // Shift element
                        tempArray[j] = tempArray[j - gap];
                        steps.push({ type: 'swap', from: j - gap, to: j });

                        steps.push({ type: 'highlight_code', line: 17 });
                        j -= gap;

                        if (j >= gap) {
                            steps.push({ type: 'highlight_code', line: 15 });
                        }
                    }

                    // Final comparison that fails
                    if (j >= gap) {
                        steps.push({ type: 'compare', i: j, j: j - gap });
                    }

                    steps.push({ type: 'highlight_code', line: 19 });
                    tempArray[j] = temp;
                    steps.push({ type: 'set', index: j, value: temp });
                    steps.push({ type: 'sorted_temp', index: j });
                }

                steps.push({ type: 'highlight_code', line: 21 });
            }

            steps.push({ type: 'highlight_code', line: 23 });
            steps.push({ type: 'complete' });

            return tempArray;
        }

        // ========== PLAY ANIMATION ==========
        async function playAnimation() {
            for (let step of steps) {
                if (!isRunning) break;

                stepCount++;
                updateDisplay();

                switch (step.type) {
                    case 'highlight_code':
                        highlightLine(step.line);
                        await sleep(animationSpeed * 0.15);
                        break;

                    case 'set_gap':
                        currentGapDisplay.textContent = step.gap;
                        gapValue.textContent = step.gap;
                        gapIndicator.style.display = 'block';
                        statusMsg.textContent = `Bắt đầu với Gap = ${step.gap}`;
                        await sleep(animationSpeed * 0.5);
                        break;

                    case 'mark_pivot':
                        setBarState(step.index, 'pivot');
                        await sleep(animationSpeed * 0.3);
                        break;

                    case 'compare':
                        await animateCompare(step.i, step.j);
                        clearBarStates();
                        break;

                    case 'swap':
                        await animateSwap(step.from, step.to);
                        break;

                    case 'set':
                        await animateSet(step.index, step.value);
                        break;

                    case 'sorted_temp':
                        await animateSorted(step.index);
                        break;

                    case 'complete':
                        clearHighlight();
                        gapIndicator.style.display = 'none';
                        statusMsg.textContent = '✅ Hoàn thành! Mảng đã được sắp xếp';
                        await showAllSorted();
                        break;
                }
            }

            isRunning = false;
            enableControls();
        }

        // ========== BUTTON HANDLERS ==========
        sortBtn.addEventListener('click', async () => {
            if (isRunning) return;

            isRunning = true;
            disableControls();

            parseArray();
            animationSpeed = parseInt(speedInput.value);
            renderBars();

            statusMsg.textContent = '⏳ Đang phân tích thuật toán...';
            await sleep(300);

            generateShellSortSteps(array);

            statusMsg.textContent = '▶ Bắt đầu sắp xếp với Shell Sort (Knuth Sequence)...';
            await sleep(500);

            await playAnimation();
        });

        randomBtn.addEventListener('click', () => {
            const size = 7 + Math.floor(Math.random() * 6); // 7-12 elements
            const randomArray = [];
            for (let i = 0; i < size; i++) {
                randomArray.push(Math.floor(Math.random() * 90) + 10);
            }
            arrayInput.value = randomArray.join(',');
            parseArray();
            renderBars();
            clearHighlight();
            gapIndicator.style.display = 'none';
            statusMsg.textContent = '🎲 Đã tạo mảng ngẫu nhiên';
        });

        resetBtn.addEventListener('click', () => {
            if (isRunning) {
                isRunning = false;
            }
            array = [...originalArray];
            arrayInput.value = originalArray.join(',');
            resetCounters();
            renderBars();
            clearHighlight();
            gapIndicator.style.display = 'none';
            statusMsg.textContent = '🔄 Đã reset về mảng ban đầu';
            enableControls();
        });

        function disableControls() {
            sortBtn.disabled = true;
            randomBtn.disabled = true;
            arrayInput.disabled = true;
            speedInput.disabled = true;
        }

        function enableControls() {
            sortBtn.disabled = false;
            randomBtn.disabled = false;
            arrayInput.disabled = false;
            speedInput.disabled = false;
        }

        // ========== RESPONSIVE ==========
        window.addEventListener('resize', () => {
            if (!isRunning) {
                renderBars();
            }
        });

        // ========== START ==========
        init();
    </script>
</body>
</html>
